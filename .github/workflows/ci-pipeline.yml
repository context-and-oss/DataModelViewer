name: CI

on:
  push:
    branches: [ "main" ]
  pull_request: {}

jobs:
  generator:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: 🔄 Restore dependencies
      run: dotnet restore
    - name: 🔨 Build
      run: dotnet build --no-restore
    - name: 🧪 Test
      run: dotnet test --no-restore --no-build --verbosity normal

  website:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x', '22.23.2', '24.x']

    steps:
    - uses: actions/checkout@v4
    - name: ⚙️ Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node }}
        cache: 'npm'
        cache-dependency-path: Website/package-lock.json
    - name: 📦 Install dependencies
      run: npm ci
      working-directory: Website
    - name: 🗃️ Move stub data
      run: npm run prepipeline
      working-directory: Website
    - name: 📝 Lint
      run: npm run lint
      working-directory: Website
    - name: 🔨 Build
      run: npm run build
      working-directory: Website

  ci:
    name: ci
    if: always()
    needs: [generator, website]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          GENERATOR_RESULT: ${{ needs.generator.result }}
          WEBSITE_RESULT: ${{ needs.website.result }}
        run: |
          test "$GENERATOR_RESULT" = success
          test "$WEBSITE_RESULT" = success
