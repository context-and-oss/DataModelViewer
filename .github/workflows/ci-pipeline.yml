name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Both jobs only build and test the checked-out code; neither writes back to
# the repo or calls the API. Without this, GITHUB_TOKEN falls back to the
# repository default, which is broader than anything here needs.
permissions:
  contents: read

jobs:
  generator:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: ⚙️ Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: 🔄 Restore dependencies
      run: dotnet restore
    - name: 🔨 Build
      run: dotnet build --no-restore
    - name: 🧪 Test
      run: dotnet test --no-restore --no-build --verbosity normal

  website:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: ⚙️ Setup Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: Website/package-lock.json
    - name: 📦 Install dependencies
      run: npm ci
      working-directory: Website
    - name: 🗃️ Move stub data
      run: npm run prepipeline
      working-directory: Website
    - name: 📝 Lint
      run: npm run lint
      working-directory: Website
    - name: 🔨 Build
      run: npm run build
      working-directory: Website
